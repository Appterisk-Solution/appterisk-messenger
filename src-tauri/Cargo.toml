[package]
name = "appterisk-messenger"
version = "0.3.0"
description = "Appterisk Messenger production account manager"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
open = "5.4.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
argon2 = "0.6.0"
zeroize = "1.9.2"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
winreg = "0.56.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
