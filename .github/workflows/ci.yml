name: Windows regression checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run cargo -- fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run cargo -- clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run cargo -- test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:updater
      - run: npm run test:isolation
      - run: npm run test:manager
      - run: npm run test:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-development-executable
          path: src-tauri/target/debug/appterisk-messenger.exe
          retention-days: 7
