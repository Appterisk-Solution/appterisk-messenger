name: Unsigned Microsoft Store MSIX candidate
on:
  workflow_dispatch:
  push:
    branches: ['feature/store-msix']
permissions:
  contents: read
concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run cargo -- fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run cargo -- clippy --manifest-path src-tauri/Cargo.toml --all-targets --features store-distribution -- -D warnings
      - run: npm run cargo -- test --manifest-path src-tauri/Cargo.toml --features store-distribution
      - run: npm run build:store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-store-submission-candidate
          path: |
            store-out/*.msix
            store-out/*.msix.json
            store-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
